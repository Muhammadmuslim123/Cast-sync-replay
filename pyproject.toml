[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cast-sync-replay"
version = "1.0.0"
description = "Time-synced multi-stream asciinema replay tool"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cast-sync-replay" }]
dependencies = []

[project.scripts]
cast-sync = "cast_sync.cli:main"
cast-sync-here = "cast_sync.cli:main_here"

[tool.setuptools.packages.find]
where = ["."]
include = ["cast_sync*"]

[tool.setuptools.package-data]
cast_sync = ["web/*"]
